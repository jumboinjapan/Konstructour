name: Admin UI regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  error-rendering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check JavaScript syntax
        run: node --check js/admin-dashboard.js
      - name: Verify untrusted log messages remain text
        run: node --test tests/admin-error-escaping.test.cjs
